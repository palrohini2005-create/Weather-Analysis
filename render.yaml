services:
  # =========================
  # BACKEND - FASTAPI
  # =========================
  - type: web
    name: climate-analysis-api
    runtime: python 
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /

  # =========================
  # FRONTEND - REACT/VITE
  # =========================
  - type: web
    name: climate-analysis-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    envVars:
      - key: VITE_API_BASE_URL
        value: https://climate-analysis-api.onrender.com

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
